<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activity · MS BMS</title>
  <link rel="icon" href="icons/icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="page-head">
      <h1>Activity (audit log)</h1>
      <div class="grow"><button type="button" id="reloadBtn">Refresh</button></div>
    </div>
    <p class="page-intro">Every change, sign-in and refusal is recorded here and can never be edited. Click a row to see what changed.</p>
    <div class="notice-bar" id="scopeBar" hidden></div>
    <div class="toolbar" style="margin-top:0">
      <input id="search" type="search" placeholder="Search table, record, action or reason">
      <select id="actionFilter"></select>
      <select id="moduleFilter"></select>
      <select id="resultFilter"></select>
      <select id="userFilter" hidden></select>
      <label style="margin:0">From <input id="dateFrom" type="date" style="width:auto;margin:0"></label>
      <label style="margin:0">To <input id="dateTo" type="date" style="width:auto;margin:0"></label>
      <button type="button" id="clearBtn" class="linkbtn">Clear filters</button>
    </div>
    <div class="msg" id="listMsg" role="status"></div>
    <div class="tablewrap">
      <table class="inv">
        <thead><tr><th>When</th><th>User</th><th>Action</th><th>Area</th><th>Record</th><th>Result</th><th>Reason</th></tr></thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </main>

  <dialog id="entryDialog" class="wide-dlg">
    <form class="dlg" method="dialog">
      <h3 id="entryTitle">Audit entry</h3>
      <div class="info" id="entryInfo"></div>
      <div id="entryBody"></div>
      <div class="btns"><button type="submit" class="primary">Close</button></div>
    </form>
  </dialog>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin-common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/activity.js"></script>
  <script src="js/install.js"></script>
</body>
</html>
