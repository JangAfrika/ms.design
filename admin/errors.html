<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Errors · MS BMS</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="page-head"><h1>Errors</h1><div class="grow"><button type="button" id="reloadBtn">Refresh</button></div></div>
    <p class="page-intro">When someone sees "Something went wrong. Reference: ...", the real error is recorded here. Paste the reference into the search box.</p>
    <div class="toolbar" style="margin-top:0"><input id="search" type="search" placeholder="Reference, action, user or error text"></div>
    <div class="msg" id="listMsg" role="status"></div>
    <div class="tablewrap">
      <table class="inv">
        <thead><tr><th>When</th><th>Reference</th><th>Action</th><th>User</th><th>Error</th></tr></thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </main>

  <dialog id="errDialog" class="wide-dlg">
    <form class="dlg" method="dialog">
      <h3>Error details</h3>
      <div id="errBody"></div>
      <div class="btns"><button type="submit" class="primary">Close</button></div>
    </form>
  </dialog>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin-common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/errors.js"></script>
  <script src="js/install.js"></script>
</body>
</html>
