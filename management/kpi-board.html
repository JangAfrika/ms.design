<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KPI board · MS BMS</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/sales.css">
  <link rel="stylesheet" href="css/finance.css">
  <link rel="stylesheet" href="css/hr.css">
  <link rel="stylesheet" href="css/mgmt.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="page-head"><h1>KPI board</h1><div class="grow"></div><div id="monthBar"></div></div>
    <div class="notice-bar">Every active KPI for the month. The system works out what it can from live data (attendance, overtime, concerns, expenses, jobs on time). The rest are typed in. Where no target has been given, the figure shows "No target" and no colour.</div>
    <div class="cards" id="cards"></div>
    <div class="toolbar">
      <label>Show <select id="depSel"></select></label>
      <div class="grow"></div>
      <button type="button" id="snapBtn" hidden>Recalculate now</button>
      <button type="button" id="verBtn" class="primary" hidden>Verify</button>
    </div>
    <div class="msg" id="msg" role="status"></div>
    <div class="tablewrap"><table class="inv"><thead><tr><th>KPI</th><th>Target</th><th class="num">Actual</th><th class="num">Before</th><th>Colour</th><th>Trend</th><th>Status</th><th>Source</th><th></th></tr></thead><tbody id="boardBody"></tbody></table></div>
  </main>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui-common.js"></script>
  <script src="js/hr-common.js"></script>
  <script src="js/mgmt-common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/kpi-board.js"></script>
  <script src="js/install.js"></script>
</body>
</html>
