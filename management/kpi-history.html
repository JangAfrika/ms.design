<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KPI history · MS BMS</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/sales.css">
  <link rel="stylesheet" href="css/finance.css">
  <link rel="stylesheet" href="css/hr.css">
  <link rel="stylesheet" href="css/mgmt.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="page-head"><h1 id="title">KPI history</h1></div>
    <div class="toolbar">
      <label>KPI <select id="kpiSel"></select></label>
      <label>For <select id="depSel"><option value="">Whole company</option></select></label>
      <label>Last <select id="cntSel"><option value="6">6 periods</option><option value="12" selected>12 periods</option><option value="24">24 periods</option></select></label>
    </div>
    <div class="msg" id="msg" role="status"></div>
    <div class="dpanel wide" id="about"></div>
    <div class="dpanel wide"><div id="chart"></div></div>
    <div class="tablewrap"><table class="inv"><thead><tr><th>Period</th><th class="num">Actual</th><th class="num">Target</th><th class="num">Achieved</th><th>Colour</th><th>Status</th></tr></thead><tbody id="histBody"></tbody></table></div>
  </main>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui-common.js"></script>
  <script src="js/hr-common.js"></script>
  <script src="js/mgmt-common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/kpi-history.js"></script>
  <script src="js/install.js"></script>
</body>
</html>
