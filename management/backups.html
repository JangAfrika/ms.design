<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backups · MS BMS</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/sales.css">
  <link rel="stylesheet" href="css/finance.css">
  <link rel="stylesheet" href="css/hr.css">
  <link rel="stylesheet" href="css/mgmt.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="page-head"><h1>Backups and exports</h1></div>
    <div class="notice-bar">Copies the tables you tick to Google Drive (System / Backups). Passwords, sessions and passkeys are never included. This makes a copy to keep; it does not restore anything.</div>
    <div class="msg" id="msg" role="status"></div>
    <div class="toolbar">
      <label>Format <select id="fmt"><option value="JSON">JSON (one file)</option><option value="CSV">CSV (one file per table)</option></select></label>
      <label>Save in <select id="kind"><option value="DAILY">Daily</option><option value="MONTHLY">Monthly</option></select></label>
      <button type="button" id="allBtn">Tick all</button><button type="button" id="noneBtn">Clear</button>
      <div class="grow"></div><button type="button" class="primary" id="runBtn" hidden>Run backup</button>
    </div>
    <div class="mg-checks" id="tblBox" style="columns:3 220px;max-height:340px"></div>
    <h2>Backups already made</h2>
    <div class="tablewrap"><table class="inv"><thead><tr><th>When</th><th>By</th><th>Kind</th><th class="num">Tables</th><th class="num">Rows</th><th>Files</th></tr></thead><tbody id="logBody"></tbody></table></div>
  </main>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui-common.js"></script>
  <script src="js/hr-common.js"></script>
  <script src="js/mgmt-common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/backups.js"></script>
  <script src="js/install.js"></script>
</body>
</html>
