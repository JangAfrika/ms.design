<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notices · MS BMS</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/sales.css">
  <link rel="stylesheet" href="css/finance.css">
  <link rel="stylesheet" href="css/hr.css">
  <link rel="stylesheet" href="css/mgmt.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="page-head"><h1>Notices</h1><div class="grow"></div><button type="button" class="primary" id="newBtn" hidden>New notice</button></div>
    <div class="notice-bar">Official notices from management. Where a notice asks for it, you confirm that you have read it, and the General Manager can see who has not.</div>
    <div class="cards" id="cards"></div>
    <div class="tabs" id="tabs" style="margin-top:12px">
      <button type="button" data-tab="all" class="on">All</button>
      <button type="button" data-tab="unread">To confirm</button>
      <button type="button" data-tab="draft" id="draftTab">Drafts</button>
    </div>
    <div class="msg" id="msg" role="status"></div>
    <div class="tablewrap"><table class="inv"><thead><tr><th>Notice</th><th>For</th><th>Takes effect</th><th>Status</th><th>Confirmed</th><th></th></tr></thead><tbody id="noticeBody"></tbody></table></div>
    <div class="pager" id="pager"></div>
  </main>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui-common.js"></script>
  <script src="js/hr-common.js"></script>
  <script src="js/mgmt-common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/notices.js"></script>
  <script src="js/install.js"></script>
</body>
</html>
