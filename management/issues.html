<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Issues · MS BMS</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/sales.css">
  <link rel="stylesheet" href="css/finance.css">
  <link rel="stylesheet" href="css/hr.css">
  <link rel="stylesheet" href="css/mgmt.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="page-head"><h1>Issues</h1><div class="grow"></div><button type="button" class="primary" id="newBtn" hidden>Report an issue</button></div>
    <div class="notice-bar">Identified, reported, assigned, resolved, recorded (checked by someone other than the person who resolved it) and reviewed. Every step is kept in the history. Issues are resolved by the agreed date (target: 90 % on time).</div>
    <div class="cards" id="cards"></div>
    <div class="tabs" id="tabs" style="margin-top:12px">
      <button type="button" data-tab="open" class="on">Open</button>
      <button type="button" data-tab="overdue">Past the date</button>
      <button type="button" data-tab="check">To check or review</button>
      <button type="button" data-tab="mine">Mine</button>
      <button type="button" data-tab="closed">Closed</button>
      <button type="button" data-tab="all">All</button>
    </div>
    <div class="toolbar"><input type="search" id="q" placeholder="Search issues" aria-label="Search issues">
      <label>Urgency <select id="priSel"><option value="">Any</option><option value="CRITICAL">Critical</option><option value="HIGH">High</option><option value="NORMAL">Normal</option><option value="LOW">Low</option></select></label>
      <label>Kind <select id="catSel"><option value="">Any</option><option value="OPERATIONAL">Operational</option><option value="FINANCIAL">Financial</option><option value="STAFF">Staff</option><option value="CUSTOMER">Customer</option><option value="SAFETY">Safety</option><option value="IT">IT</option></select></label></div>
    <div class="msg" id="msg" role="status"></div>
    <div class="tablewrap"><table class="inv"><thead><tr><th>No.</th><th>Issue</th><th>Urgency</th><th>Status</th><th>Assigned to</th><th>Agreed date</th><th></th></tr></thead><tbody id="issueBody"></tbody></table></div>
    <div class="pager" id="pager"></div>
  </main>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui-common.js"></script>
  <script src="js/hr-common.js"></script>
  <script src="js/mgmt-common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/issues.js"></script>
  <script src="js/install.js"></script>
</body>
</html>
