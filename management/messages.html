<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages · MS BMS</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/sales.css">
  <link rel="stylesheet" href="css/finance.css">
  <link rel="stylesheet" href="css/hr.css">
  <link rel="stylesheet" href="css/mgmt.css">
  <link rel="stylesheet" href="css/messages.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="page-head"><h1>Messages</h1>
      <div class="mx-switch" id="mxSwitch"><button type="button" data-noicon="1" data-mode="msg" class="on" title="Conversations with other people">Messages</button><button type="button" data-noicon="1" data-mode="req" title="Requests to a department">Requests</button></div>
      <div class="grow"></div><button type="button" id="roleReq" hidden>Request a role</button><button type="button" class="primary" id="newReq" hidden>New request</button></div>
    <div class="msg" id="msg" role="status"></div>
    <div class="mx" id="mx">
      <section class="mx-list" aria-label="Conversations">
        <div class="mx-head"><h2>Messages</h2><div class="btns"><button type="button" class="primary" id="newMsg" hidden>New message</button></div></div>
        <div class="mx-search"><input type="search" id="mxSearch" placeholder="Search messages" aria-label="Search messages" autocomplete="off"></div>
        <ul class="mx-rows" id="mxRows"></ul>
      </section>
      <section class="mx-thread" id="mxThread" aria-label="Conversation"></section>
    </div>
    <div id="reqWrap" hidden>
      <div class="tabs" id="tabs">
        <button type="button" data-tab="req-incoming" class="on">Requests to me</button>
        <button type="button" data-tab="req-mine">My requests</button>
        <button type="button" data-tab="req-open">All open requests</button>
      </div>
      <div class="tablewrap"><table class="inv"><thead><tr><th>Request</th><th>From</th><th>To</th><th>Priority</th><th>Needed by</th><th>Status</th><th></th></tr></thead><tbody id="reqBody"></tbody></table></div>
      <div class="pager" id="pager"></div>
    </div>
    <dialog id="mxNew"><form class="dlg" id="mxForm" novalidate>
      <h3>New message</h3>
      <div class="mx-chips" id="mxChips"></div>
      <label>To <input type="search" id="mxWho" placeholder="Search by name or role" autocomplete="off"></label>
      <div class="mx-pick" id="mxPick"></div>
      <label class="req">Subject <input id="mxSub" maxlength="200" autocomplete="off"></label>
      <label class="req">Message <textarea id="mxText" rows="5" maxlength="10000"></textarea></label>
      <div class="err" id="mxErr"></div>
      <div class="btns"><button type="button" id="mxCancel">Cancel</button><button type="submit" class="primary" id="mxSend">Send</button></div>
    </form></dialog>
  </main>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui-common.js"></script>
  <script src="js/hr-common.js"></script>
  <script src="js/mgmt-common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/messages.js"></script>
  <script src="js/install.js"></script>
</body>
</html>
