<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Where are the jobs · MS BMS</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/jobs.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="page-head">
      <h1>Where are the jobs</h1>
      <div class="grow"></div>
    </div>
    <p class="hint" id="whereSum"></p>
    <div class="sec-chips" id="secChips" role="group" aria-label="Sections"></div>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search job number, job name or customer" aria-label="Search jobs">
      <select id="sectionFilter" aria-label="Section"></select>
      <div class="chips" id="quick" role="group" aria-label="Quick filters">
        <button type="button" data-f="" class="active">All open jobs</button>
        <button type="button" data-f="overdue">Late</button>
        <button type="button" data-f="hold">On hold</button>
      </div>
      <button type="button" id="reloadBtn" class="grow">Refresh</button>
    </div>
    <div class="msg" id="listMsg" role="status"></div>
    <div class="tablewrap">
      <table class="inv">
        <thead><tr><th>Job no.</th><th>Customer</th><th>Where it is</th><th>Held by</th><th class="num">Days there</th><th>Deadline</th><th>Progress</th></tr></thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </main>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/ui-common.js"></script>
  <script src="js/pages/locations.js"></script>
  <script src="js/install.js"></script>
</body>
</html>
