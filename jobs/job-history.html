<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job History · MS BMS</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/jobs.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="page-head">
      <h1>Job History</h1>
      <div class="grow"></div>
    </div>
    <p class="hint">Jobs that were delivered and paid in full. Open one to see the whole story.</p>
    <div class="toolbar" style="margin-top:0">
      <input id="search" type="search" placeholder="Search job number, job name or customer" aria-label="Search job history">
      <select id="customerFilter" aria-label="Customer"></select>
      <label class="inl">From <input id="dateFrom" type="date"></label>
      <label class="inl">To <input id="dateTo" type="date"></label>
      <button type="button" id="reloadBtn" class="grow">Refresh</button>
    </div>
    <div class="msg" id="listMsg" role="status"></div>
    <div class="tablewrap">
      <table class="inv">
        <thead><tr><th>Job no.</th><th>Job name</th><th>Customer</th><th>Delivered</th><th>By</th><th class="num">Invoiced</th><th class="num">Paid</th><th>Payment</th></tr></thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </main>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/ui-common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/job-history.js"></script>
  <script src="js/install.js"></script>
</body>
</html>
