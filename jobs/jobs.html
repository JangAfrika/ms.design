<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jobs & Work Sheets · MS BMS</title>
  <link rel="icon" href="icons/icon.svg">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/jobs.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="page-head">
      <h1>Jobs &amp; Work Sheets</h1>
      <div class="grow"><a class="btn primary" id="addBtn" href="jobs/job-new.html" hidden>New job</a></div>
    </div>
    <div class="toolbar" style="margin-top:0">
      <input id="search" type="search" placeholder="Search job number, job name or customer" aria-label="Search jobs">
      <select id="statusFilter" aria-label="Status"></select>
      <select id="prioFilter" aria-label="Priority"></select>
      <select id="sortBy" aria-label="Order"></select>
      <div class="chips" id="quick" role="group" aria-label="Quick filters">
        <button type="button" data-f="" class="active">All</button>
        <button type="button" data-f="overdue">Overdue</button>
        <button type="button" data-f="due">Due in 48 hours</button>
      </div>
      <button type="button" id="reloadBtn" class="grow">Refresh</button>
    </div>
    <div class="msg" id="listMsg" role="status"></div>
    <div class="tablewrap">
      <table class="inv">
        <thead><tr><th>Job no.</th><th>Job name</th><th>Customer</th><th>Priority</th><th>Status</th><th>Deadline</th></tr></thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </main>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/jobs.js"></script>
</body>
</html>
