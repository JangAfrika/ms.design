<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payments received · MS BMS</title>
  <link rel="icon" href="icons/icon.svg">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/sales.css">
  <link rel="stylesheet" href="css/finance.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="page-head">
      <h1>Payments received</h1>
      <div class="grow"><button type="button" class="primary" id="newBtn" hidden>Record payment</button></div>
    </div>
    <div class="toolbar fin-filters" style="margin-top:0">
      <input id="search" type="search" placeholder="Search customer, receipt, reference or invoice">
      <select id="custFilter"><option value="">All customers</option></select>
      <select id="methodFilter"></select>
      <select id="statusFilter"></select>
      <label class="check"><input type="checkbox" id="advOnly"> With money on account</label>
      <button type="button" id="reloadBtn" class="grow">Refresh</button>
    </div>
    <div class="msg" id="listMsg" role="status"></div>
    <div class="tablewrap">
      <table class="inv">
        <thead><tr><th>Date</th><th>Receipt</th><th>Customer</th><th>Method</th><th>For invoices</th><th class="num">Amount</th><th class="num">On account</th><th>Status</th></tr></thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </main>

  <dialog id="viewDialog" class="fin-wide">
    <div class="dlg">
      <div id="viewBody"></div>
      <div class="err" id="viewError"></div>
      <div class="btns" id="viewBtns"></div>
    </div>
  </dialog>

  <dialog id="noteDialog">
    <form class="dlg" id="noteForm" novalidate>
      <h3 id="noteTitle">Reverse payment</h3>
      <div class="info" id="noteInfo"></div>
      <label class="req">Reason <textarea id="noteText" rows="3" maxlength="300"></textarea></label>
      <div class="err" id="noteError"></div>
      <div class="btns">
        <button type="button" id="noteCancel">Cancel</button>
        <button type="submit" class="danger-solid" id="noteSave">Reverse payment</button>
      </div>
    </form>
  </dialog>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/finance-common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/payments.js"></script>
</body>
</html>
