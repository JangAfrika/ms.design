<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profit & loss · MS BMS</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/finance.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="page-head">
      <h1 id="rTitle">Profit &amp; loss</h1>
      <div class="grow"><button type="button" id="printBtn">Print / PDF</button></div>
    </div>
    <div class="tabs" id="tabs">
      <button type="button" class="on" data-tab="pl">Profit &amp; loss</button>
      <button type="button" data-tab="cf">Cash flow</button>
      <button type="button" data-tab="bs">Balance sheet</button>
      <button type="button" data-tab="tb">Trial balance</button>
    </div>
    <div class="report-head" id="plHead">
      <label>From <input type="date" id="plFrom"></label>
      <label>To <input type="date" id="plTo"></label>
      <label>Show <select id="plBy"><option value="month">Month by month</option><option value="total">Totals only</option></select></label>
      <label>Department <select id="plDept"><option value="">Whole company</option></select></label>
      <button type="button" class="primary" id="plRun">Show</button>
    </div>
    <div class="report-head" id="cfHead" hidden>
      <label>From <input type="date" id="cfFrom"></label>
      <label>To <input type="date" id="cfTo"></label>
      <button type="button" class="primary" id="cfRun">Show</button>
    </div>
    <div class="report-head" id="bsHead" hidden>
      <label>As at <input type="date" id="bsAsOf"></label>
      <button type="button" class="primary" id="bsRun">Show</button>
    </div>
    <div class="report-head" id="tbHead" hidden>
      <label>From <input type="date" id="tbFrom"><span class="qhint">Empty: from the first entry</span></label>
      <label>To <input type="date" id="tbTo"></label>
      <button type="button" class="primary" id="tbRun">Show</button>
    </div>
    <div class="msg" id="rMsg" role="status"></div>
    <div class="cards fin-cards" id="rCards"></div>
    <div class="report-scroll" id="rBody"></div>
  </main>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/finance-common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/reports.js"></script>
  <script src="js/install.js"></script>
</body>
</html>
