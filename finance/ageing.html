<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receivables ageing · MS BMS</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/finance.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="page-head">
      <h1>Receivables ageing</h1>
      <div class="grow"><button type="button" id="printBtn">Print / PDF</button></div>
    </div>
    <div class="toolbar fin-filters" style="margin-top:0">
      <label class="inline">As at <input type="date" id="asOf"></label>
      <label class="check"><input type="checkbox" id="lateOnly"> Only customers with overdue invoices</label>
      <input id="search" type="search" placeholder="Search customer">
      <button type="button" id="reloadBtn" class="grow">Refresh</button>
    </div>
    <div class="msg" id="listMsg" role="status"></div>
    <div class="cards fin-cards" id="ageCards"></div>
    <div class="tablewrap">
      <table class="inv">
        <thead><tr><th>Customer</th><th class="num">Not yet due</th><th class="num">1–30 days</th><th class="num">31–60 days</th><th class="num">61–90 days</th><th class="num">Over 90</th><th class="num">Owes</th><th class="num">Paid in advance</th></tr></thead>
        <tbody id="listBody"></tbody>
        <tfoot id="listFoot"></tfoot>
      </table>
    </div>
    <p class="fin-note">Days are counted from each invoice's due date. Credit notes and payments already allocated are taken off. Click a customer to see their account, payments and statement.</p>
  </main>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/finance-common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/ageing.js"></script>
  <script src="js/install.js"></script>
</body>
</html>
