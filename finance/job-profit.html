<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job profitability · MS BMS</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/finance.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="page-head">
      <h1>Job profitability</h1>
      <div class="grow"><button type="button" id="printBtn">Print / PDF</button></div>
    </div>
    <div class="toolbar fin-filters" style="margin-top:0">
      <input id="search" type="search" placeholder="Search job number, name or customer">
      <select id="statusFilter" aria-label="Job status"></select>
      <select id="custFilter" aria-label="Customer"><option value="">All customers</option></select>
      <label class="inline">Opened from <input type="date" id="fromDate"></label>
      <label class="inline">to <input type="date" id="toDate"></label>
      <label class="check"><input type="checkbox" id="lossOnly"> Losses only</label>
      <button type="button" id="reloadBtn" class="grow">Refresh</button>
    </div>
    <div class="msg" id="listMsg" role="status"></div>
    <div class="cards fin-cards" id="jpCards"></div>
    <div class="panel" id="jpCats" hidden><h2>Where the cost went</h2><div id="jpCatBody"></div></div>
    <div class="tablewrap">
      <table class="inv">
        <thead><tr><th>Job</th><th>Customer</th><th>Status</th><th class="num">Revenue</th><th class="num">Cost</th><th class="num">Profit</th><th class="num">Margin</th></tr></thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
    <p class="fin-note">Revenue is the job's selling price. Cost is everything charged to the job: paid expenses and the labour, electricity, fuel, overtime and transport that Finance adds. Click a job for its cost sheet.</p>
  </main>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/finance-common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/job-profit.js"></script>
  <script src="js/install.js"></script>
</body>
</html>
