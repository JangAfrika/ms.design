<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Your proforma invoice · MS Designs &amp; Printing</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
  <style>
    .rp { min-height: 100vh; padding: 20px 14px 40px; background: linear-gradient(160deg, #12306b 0%, #0b1d47 100%); }
    .rp-wrap { width: min(860px, 100%); margin: 0 auto; }
    .rp-card { background: #fff; border-radius: 12px; padding: 22px 22px 20px; box-shadow: 0 20px 60px rgba(0,0,0,.35); margin-bottom: 16px; }
    .rp-head { text-align: center; }
    .rp-head img { max-height: 72px; max-width: 180px; object-fit: contain; }
    .rp-head h1 { margin: 6px 0 2px; font-size: 19px; color: #12306b; }
    .rp-head .sub { color: var(--muted); font-size: 13.5px; }
    .rp-scale { width: 100%; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .rp-doc { display: block; width: 100%; height: 640px; transform-origin: 0 0; border: 0; background: #fff; }
    .rp-bar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center; margin: 0 0 12px; font-size: 13.5px; }
    .rp-bar b { font-size: 15px; }
    .rp-ask h2 { margin: 0 0 8px; font-size: 16px; color: #12306b; text-transform: none; letter-spacing: 0; }
    .rp-ask label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
    .rp-ask input[type=text], .rp-ask textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
    .rp-ask textarea { min-height: 150px; resize: vertical; }
    .rp-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .rp-btns button { flex: 1 1 200px; min-height: 48px; font-size: 16px; font-weight: 700; border-radius: 8px; cursor: pointer; }
    .rp-ok { background: #1b7f3b; border: 1px solid #1b7f3b; color: #fff; }
    .rp-ch { background: #fff; border: 1.5px solid #12306b; color: #12306b; }
    .rp-btns button:disabled { opacity: .6; cursor: wait; }
    .rp-msg { text-align: center; padding: 8px 0; }
    .rp-msg .big { font-size: 38px; line-height: 1; }
    .rp-msg h2 { margin: 8px 0 6px; font-size: 18px; color: #12306b; text-transform: none; letter-spacing: 0; }
    .rp-msg p { margin: 6px 0; font-size: 14.5px; line-height: 1.5; }
    .rp-quote { white-space: pre-wrap; text-align: left; background: #f5f7fb; border-left: 3px solid #12306b; padding: 10px 12px; border-radius: 6px; margin: 10px auto; max-width: 560px; font-size: 14px; }
    .rp .err { margin-top: 10px; color: #b3261e; font-size: 13.5px; }
    .rp-foot { text-align: center; color: #c9d4ee; font-size: 12.5px; line-height: 1.6; }
    @media (max-width: 520px) { .rp { padding: 10px 8px 30px; } .rp-card { padding: 16px 14px; } }
  </style>
</head>
<body>
  <main class="rp">
    <div class="rp-wrap">
      <section class="rp-card rp-head">
        <img alt="" data-app-logo><span class="auth-mark" data-app-mark hidden>MS</span>
        <h1 id="coName">MS Designs &amp; Printing</h1>
        <div class="sub" id="subLine">Loading your proforma invoice...</div>
      </section>
      <section class="rp-card" id="stateCard" hidden aria-live="polite"></section>
      <section class="rp-card" id="docCard" hidden>
        <div class="rp-bar"><span>Proforma invoice <b id="docNo"></b></span><button type="button" id="pdfBtn" class="plain">Download PDF</button></div>
        <div class="rp-scale" id="docBox"><iframe id="docFrame" class="rp-doc" title="Proforma invoice" sandbox="allow-same-origin" scrolling="no"></iframe></div>
        <div class="err" id="pdfErr" role="alert"></div>
      </section>
      <section class="rp-card rp-ask" id="askCard" hidden>
        <h2>Your answer</h2>
        <label for="rpName">Your name</label>
        <input id="rpName" type="text" maxlength="80" autocomplete="name" placeholder="Type your full name">
        <label for="rpNote">Changes you would like <span class="opt">(needed only if you ask for changes)</span></label>
        <textarea id="rpNote" maxlength="2000" placeholder="For example: please change the quantity of ... to 500, or add ..."></textarea>
        <div class="err" id="rpErr" role="alert"></div>
        <div class="rp-btns">
          <button type="button" class="rp-ok" id="okBtn">Approve</button>
          <button type="button" class="rp-ch" id="chBtn">Request changes</button>
        </div>
      </section>
      <div class="rp-foot" id="coFoot"></div>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/pages/respond.js"></script>
</body>
</html>
