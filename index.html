<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Storage Payment</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fa;
      color: #17202a;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 16px;
      padding: 42px 32px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef2f7;
      font-size: 32px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 28px;
      line-height: 1.25;
    }

    p {
      margin: 0 auto 24px;
      max-width: 430px;
      color: #5f6b76;
      font-size: 16px;
      line-height: 1.6;
    }

    .email {
      display: inline-block;
      margin-bottom: 26px;
      font-weight: 700;
      color: #0f5d4a;
      text-decoration: none;
      word-break: break-word;
    }

    .button {
      display: inline-block;
      padding: 13px 22px;
      border-radius: 8px;
      background: #0f5d4a;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      transition: opacity 0.2s ease;
    }

    .button:hover {
      opacity: 0.9;
    }

    .note {
      margin-top: 22px;
      font-size: 13px;
      color: #7a858f;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="icon" aria-hidden="true">☁</div>

    <h1>Waiting for Cloud Storage Payment</h1>

    <p>
      Please complete the cloud storage payment and send the payment receipt
      to the email address below.
    </p>

    <a class="email" href="mailto:info.jangafrica@gmail.com">
      info.jangafrica@gmail.com
    </a>

    <br>

    <a
      class="button"
      href="mailto:info.jangafrica@gmail.com?subject=Cloud%20Storage%20Payment%20Receipt&body=Hello%2C%0A%0APlease%20find%20my%20cloud%20storage%20payment%20receipt%20attached.%0A%0AThank%20you."
    >
      Send Payment Receipt
    </a>

    <div class="note">
      Please attach your payment receipt before sending the email.
    </div>
  </main>
</body>
</html>
