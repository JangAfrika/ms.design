<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customers · MS BMS</title>
  <link rel="icon" href="icons/icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="page-head">
      <h1>Customers</h1>
      <div class="grow"><button type="button" class="primary" id="addBtn" hidden>Add customer</button></div>
    </div>
    <div class="toolbar" style="margin-top:0">
      <input id="search" type="search" placeholder="Search name, number, phone or email">
      <select id="statusFilter"><option value="">Active and inactive</option></select>
      <button type="button" id="reloadBtn" class="grow">Refresh</button>
    </div>
    <div class="msg" id="listMsg" role="status"></div>
    <div class="tablewrap">
      <table class="inv">
        <thead><tr><th>No.</th><th>Customer</th><th>Type</th><th>Contact</th><th>Account manager</th><th>Status</th></tr></thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </main>

  <dialog id="custDialog">
    <form class="dlg" id="custForm" novalidate>
      <h3 id="custTitle">Add customer</h3>
      <div class="info">The account manager follows up enquiries, quotations and jobs for this customer.</div>
      <label class="req">Customer name <input name="customer_name" type="text" maxlength="120" required></label>
      <div class="two">
        <label>Type <select name="customer_type" id="cType"></select></label>
        <label>Account manager <select name="account_manager_id" id="cManager"></select></label>
      </div>
      <div class="two">
        <label>Phone <input name="phone" type="tel" maxlength="40" placeholder="+220 …"></label>
        <label>Email <input name="email" type="email" maxlength="120"></label>
      </div>
      <label>Address <input name="address" type="text" maxlength="200"></label>
      <div class="two">
        <label>TIN number <input name="tin_number" type="text" maxlength="40"></label>
        <label class="check" style="margin-top:22px"><input name="is_major_client" type="checkbox"> Major client</label>
      </div>
      <div class="err" id="custError"></div>
      <div class="btns">
        <button type="button" id="custCancel">Cancel</button>
        <button type="submit" class="primary" id="custSave">Save</button>
      </div>
    </form>
  </dialog>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/customers-form.js"></script>
  <script src="js/pages/customers.js"></script>
  <script src="js/install.js"></script>
</body>
</html>
