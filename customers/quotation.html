<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quotation · MS BMS</title>
  <link rel="icon" href="icons/icon.svg">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/sales.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="crumbs" id="dCrumbs"><a href="customers/quotations.html">Quotations</a></div>
    <div class="page-head"><h1 id="dTitle">Quotation</h1><div class="grow" id="dActions"></div></div>
    <div class="msg" id="dStatus" role="status"></div>
    <div id="dBody"></div>
  </main>

  <dialog id="noteDialog">
    <form class="dlg" id="noteForm" novalidate>
      <h3 id="noteTitle">Note</h3>
      <div class="info" id="noteInfo"></div>
      <label id="noteLabel">Note <textarea name="note" id="noteText" rows="3" maxlength="500"></textarea></label>
      <div class="err" id="noteError"></div>
      <div class="btns">
        <button type="button" id="noteCancel">Cancel</button>
        <button type="submit" class="primary" id="noteSave">Save</button>
      </div>
    </form>
  </dialog>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/quotation.js"></script>
</body>
</html>
