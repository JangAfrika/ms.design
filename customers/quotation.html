<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proforma invoice · MS BMS</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/sales.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="crumbs" id="dCrumbs"><a href="customers/quotations.html">Proforma invoices</a></div>
    <div class="page-head"><h1 id="dTitle">Proforma invoice</h1><div class="grow" id="dActions"></div></div>
    <div class="msg" id="dStatus" role="status"></div>
    <div id="dBody"></div>
  </main>

  <dialog id="noteDialog">
    <form class="dlg" id="noteForm" novalidate>
      <h3 id="noteTitle">Note</h3>
      <div class="info" id="noteInfo"></div>
      <label id="noteLabel">Note <textarea name="note" id="noteText" rows="3" maxlength="500"></textarea></label>
      <div class="err" id="noteError"></div>
      <div class="btns">
        <button type="button" id="noteCancel">Cancel</button>
        <button type="submit" class="primary" id="noteSave">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="approveDialog">
    <form class="dlg" id="approveForm" novalidate>
      <h3>Customer approved this proforma</h3>
      <div class="info">Record the go-ahead the customer gave you. The General Manager is told to create the job card.</div>
      <div class="two">
        <label class="req">How did they approve? <select id="apVia"><option value="">— choose —</option><option value="PHONE">By phone call</option><option value="EMAIL">By email</option><option value="IN_PERSON">In person</option></select></label>
        <label class="req">Day they approved <input id="apOn" type="date"></label>
      </div>
      <label class="req">Who approved, and any note <input id="apNote" type="text" maxlength="300" placeholder="e.g. Mr Jallow, the manager, said go ahead"></label>
      <div class="err" id="apError"></div>
      <div class="btns">
        <button type="button" id="apCancel">Cancel</button>
        <button type="submit" class="primary" id="apSave">Record approval</button>
      </div>
    </form>
  </dialog>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/customers-form.js"></script>
  <script src="js/docs-common.js"></script>
  <script src="js/signature.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/quotation.js"></script>
  <script src="js/install.js"></script>
</body>
</html>
