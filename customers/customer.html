<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer · MS BMS</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/finance.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="crumbs" id="dCrumbs"><a href="customers/customers.html">Customers</a></div>
    <div class="page-head"><h1 id="dTitle">Customer</h1><div class="grow" id="dActions"></div></div>
    <div class="msg" id="dStatus" role="status"></div>
    <div id="dBody"></div>
  </main>

  <dialog id="custDialog">
    <form class="dlg" id="custForm" novalidate>
      <h3 id="custTitle">Edit customer</h3>
      <label class="req">Customer name <input name="customer_name" type="text" maxlength="120" required></label>
      <div class="two">
        <label>Type <select name="customer_type" id="cType"></select></label>
        <label>Account manager <select name="account_manager_id" id="cManager"></select></label>
      </div>
      <div class="two">
        <label>Phone <input name="phone" type="tel" maxlength="40" placeholder="+220 …"></label>
        <label>Email <input name="email" type="email" maxlength="120"></label>
      </div>
      <label>Address <input name="address" type="text" maxlength="200"></label>
      <div class="two">
        <label>TIN number <input name="tin_number" type="text" maxlength="40"></label>
        <label class="check" style="margin-top:22px"><input name="is_major_client" type="checkbox"> Major client</label>
      </div>
      <div class="err" id="custError"></div>
      <div class="btns">
        <button type="button" id="custCancel">Cancel</button>
        <button type="submit" class="primary" id="custSave">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="contactDialog">
    <form class="dlg" id="contactForm" novalidate>
      <h3>Add contact</h3>
      <label class="req">Name <input name="contact_name" type="text" maxlength="120" required></label>
      <div class="two">
        <label>Role <input name="role_title" type="text" maxlength="80"></label>
        <label>Phone <input name="phone" type="tel" maxlength="40"></label>
      </div>
      <label>Email <input name="email" type="email" maxlength="120"></label>
      <label class="check"><input name="can_approve_designs" type="checkbox"> Can approve designs</label>
      <label class="check"><input name="is_primary" type="checkbox"> Primary contact</label>
      <div class="err" id="contactError"></div>
      <div class="btns">
        <button type="button" id="contactCancel">Cancel</button>
        <button type="submit" class="primary" id="contactSave">Save</button>
      </div>
    </form>
  </dialog>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/customers-form.js"></script>
  <script src="js/finance-common.js"></script>
  <script src="js/docs-common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/customer.js"></script>
  <script src="js/install.js"></script>
</body>
</html>
