<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer feedback · MS BMS</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="page-head">
      <h1>Customer feedback</h1>
      <div class="grow"><button type="button" id="reloadBtn">Refresh</button></div>
    </div>
    <div class="dpanel wide" id="pendingBox" hidden>
      <h3>Delivered jobs waiting for feedback</h3>
      <div class="tablewrap"><table class="inv"><thead><tr><th>Job</th><th>Customer</th><th>Delivered</th><th></th></tr></thead><tbody id="pendingBody"></tbody></table></div>
    </div>
    <div class="cards" id="sumCards"></div>
    <div class="toolbar"><input id="search" type="search" placeholder="Search by customer, job or comment" aria-label="Search feedback"></div>
    <div class="msg" id="listMsg" role="status"></div>
    <div class="tablewrap">
      <table class="inv">
        <thead><tr><th>Date</th><th>Customer</th><th>Job</th><th>Rating</th><th>Comment</th><th>Collected by</th></tr></thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </main>

  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/feedback-form.js"></script>
  <script src="js/pages/feedback.js"></script>
  <script src="js/install.js"></script>
</body>
</html>
