<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My HR · MS BMS</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/sales.css">
  <link rel="stylesheet" href="css/finance.css">
  <link rel="stylesheet" href="css/hr.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="page-head">
      <h1>My HR</h1>
      <div class="grow"><button type="button" class="primary" id="leaveBtn" hidden>Request leave</button> <button type="button" id="concernBtn" hidden>Raise a concern</button></div>
    </div>
    <div class="msg" id="msg" role="status"></div>
    <div class="notice-bar" id="noStaff" hidden>Your login is not linked to a staff record, so there is nothing here for you. Ask the System Administrator.</div>
    <div id="body" hidden>
      <div class="cards" id="cards"></div>
      <div class="dgrid">
        <div class="dpanel wide" id="todayBox"></div>
        <div class="dpanel" id="balBox"></div>
        <div class="dpanel" id="holBox"></div>
        <div class="dpanel wide" id="leaveBox"></div>
        <div class="dpanel wide" id="attBox"></div>
        <div class="dpanel wide" id="otBox"></div>
        <div class="dpanel wide" id="trainBox"></div>
        <div class="dpanel wide" id="concernBox"></div>
      </div>
    </div>
  </main>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui-common.js"></script>
  <script src="js/hr-common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/my-hr.js"></script>
  <script src="js/install.js"></script>
</body>
</html>
