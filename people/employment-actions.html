<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employment actions · MS BMS</title>
  <link rel="icon" href="icons/icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="page-head">
      <h1>Employment actions</h1>
      <div class="grow"><button type="button" class="primary" id="addBtn" hidden>New notice</button></div>
    </div>
    <p class="page-intro" id="intro"></p>
    <div class="toolbar" style="margin-top:0">
      <input id="search" type="search" placeholder="Search employee, action or reason">
      <select id="statusFilter"></select>
      <button type="button" id="reloadBtn" class="grow">Refresh</button>
    </div>
    <div class="msg" id="listMsg" role="status"></div>
    <div class="tablewrap">
      <table class="inv">
        <thead><tr><th>Employee</th><th>Action</th><th>Effective</th><th>From</th><th>Reason</th><th>Status</th><th>Result</th><th></th></tr></thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </main>

  <dialog id="noticeDialog">
    <form class="dlg" id="noticeForm" novalidate>
      <h3>New employment notice</h3>
      <div class="info">The System Administrator receives this notice and applies the account change. It is recorded in the audit log.</div>
      <label class="req">Employee <select name="employee_id" id="nEmployee" required></select></label>
      <div class="two">
        <label class="req">Action <select name="action_type" id="nType"></select></label>
        <label class="req">Effective date <input name="effective_date" type="date" required></label>
      </div>
      <label class="req">Reason <textarea name="reason" rows="4" maxlength="1000" required></textarea></label>
      <div class="err" id="noticeError"></div>
      <div class="btns">
        <button type="button" id="noticeCancel">Cancel</button>
        <button type="submit" class="primary" id="noticeSave">Send to System Administrator</button>
      </div>
    </form>
  </dialog>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin-common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/employment-actions.js"></script>
  <script src="js/install.js"></script>
</body>
</html>
