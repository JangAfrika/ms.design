<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training · MS BMS</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/sales.css">
  <link rel="stylesheet" href="css/finance.css">
  <link rel="stylesheet" href="css/hr.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="page-head">
      <h1>Training</h1>
      <div class="grow"><button type="button" class="primary" id="addBtn" hidden>Plan training</button></div>
    </div>
    <div class="cards" id="cards"></div>
    <div class="tabs" id="tabs" style="margin-top:12px">
      <button type="button" data-tab="people" class="on">By person</button>
      <button type="button" data-tab="records">All records</button>
    </div>
    <div class="msg" id="msg" role="status"></div>
    <section id="peoplePane">
      <div class="tablewrap"><table class="inv"><thead><tr><th>Person</th><th class="num">Required</th><th class="num">Completed</th><th class="num">Overdue</th><th class="num">Missed</th><th class="num">Done %</th><th>Next due</th><th></th></tr></thead><tbody id="pBody"></tbody></table></div>
    </section>
    <section id="recPane" hidden>
      <div class="toolbar fin-filters" style="margin-top:0">
        <select id="fStatus" aria-label="Status"></select>
        <label class="inline"><input type="checkbox" id="fOver"> Overdue only</label>
        <input id="search" type="search" placeholder="Search name or training">
        <button type="button" id="reloadBtn" class="grow">Refresh</button>
      </div>
      <div class="tablewrap"><table class="inv"><thead><tr><th>Person</th><th>Training</th><th>Required</th><th>Due</th><th>Status</th><th>Done on</th><th></th></tr></thead><tbody id="rBody"></tbody></table></div>
      <div class="pager" id="pager"></div>
    </section>
  </main>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui-common.js"></script>
  <script src="js/hr-common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/training.js"></script>
  <script src="js/install.js"></script>
</body>
</html>
