<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/forms.css">

<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="page-head">
      <h1>Monthly attendance</h1>
      <div class="grow"><a class="btn no-print" href="people/attendance.html">Daily register</a> <button type="button" id="printBtn">Print</button></div>
    </div>
    <div class="toolbar" style="margin-top:0"><span id="mBar"></span><span id="mStatus"></span></div>
    <div class="msg" id="msg" role="status"></div>
    <div class="ar-steps" id="steps"></div>
    <div id="banner"></div>
    <div class="cards" id="mCards"></div>
    <h3 class="sub-h">By department</h3>
    <div class="tablewrap"><table class="inv"><thead><tr><th>Department</th><th class="num">Staff</th><th class="num">On time</th><th class="num">Late</th><th class="num">Absent</th><th class="num">Leave</th><th class="num">Sick</th><th class="num">Attendance</th></tr></thead><tbody id="mDeps"></tbody></table></div>
    <h3 class="sub-h">By person</h3>
    <div class="tablewrap"><table class="inv"><thead><tr><th>Person</th><th class="num">On time</th><th class="num">Late</th><th class="num">Absent</th><th class="num">Leave</th><th class="num">Sick</th><th class="num">Not recorded</th><th class="num">Attendance</th><th></th></tr></thead><tbody id="mBody"></tbody></table></div>
    <h3 class="sub-h">General Manager's comment</h3>
    <div id="noteBox"></div>
    <div class="ar-btns no-print" id="btns"></div>
  </main>
  </div>
</div>
