<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leave · MS BMS</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/sales.css">
  <link rel="stylesheet" href="css/finance.css">
  <link rel="stylesheet" href="css/hr.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="page-head">
      <h1>Leave</h1>
      <div class="grow"><button type="button" class="primary" id="reqBtn" hidden>Request leave</button></div>
    </div>
    <div class="tabs" id="tabs">
      <button type="button" data-tab="waiting" id="tWaiting" hidden>Waiting for me <span id="tWaitN"></span></button>
      <button type="button" data-tab="team" id="tTeam" hidden>All requests</button>
      <button type="button" data-tab="mine" id="tMine" hidden>My requests</button>
      <button type="button" data-tab="calendar">Team calendar</button>
    </div>
    <div class="msg" id="msg" role="status"></div>

    <section id="listPane">
      <div class="toolbar fin-filters" style="margin-top:0">
        <select id="fStatus" aria-label="Status"></select>
        <input id="search" type="search" placeholder="Search name or reason">
        <button type="button" id="reloadBtn" class="grow">Refresh</button>
      </div>
      <div class="tablewrap">
        <table class="inv">
          <thead><tr><th>Person</th><th>Type</th><th>From</th><th>To</th><th class="num">Days</th><th>Status</th><th>Decided by</th><th></th></tr></thead>
          <tbody id="listBody"></tbody>
        </table>
      </div>
      <div class="pager" id="pager"></div>
    </section>

    <section id="calPane" hidden>
      <div class="toolbar" style="margin-top:0"><span id="cBar"></span></div>
      <div class="tablewrap" id="calBox"></div>
      <div class="hr-key"><span><i class="away"></i>Away</span><span><i class="wait"></i>Waiting for a decision</span><span><i class="hol"></i>Public holiday</span><span><i class="off"></i>Rest day</span></div>
    </section>
  </main>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui-common.js"></script>
  <script src="js/hr-common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/leave.js"></script>
  <script src="js/install.js"></script>
</body>
</html>
