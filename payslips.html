<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>

  <header class="appbar"></header>
  <main class="page">
    <div class="crumbs" id="dCrumbs" hidden><a href="payslips.html">My payslips</a></div>
    <div class="page-head"><h1 id="dTitle">My payslips</h1><div class="grow" id="dActions"></div></div>
    <div class="msg" id="dStatus" role="status"></div>
    <div id="listView">
      <p class="fin-note" style="margin:0 0 10px">Your payslips appear here once the salaries for the month have been paid. Only you (and Finance) can see them. Open one to view or print it.</p>
      <div class="tablewrap">
        <table class="inv">
          <thead><tr><th>Month</th><th>Paid on</th><th class="num">Gross pay</th><th class="num">Deductions</th><th class="num">Net pay</th></tr></thead>
          <tbody id="listBody"></tbody>
        </table>
      </div>
      <div class="pager" id="pager"></div>
    </div>
    <div id="docView" hidden></div>
  </main>
