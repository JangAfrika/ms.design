<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History · MS BMS</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/sales.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="page-head"><h1>History</h1><div class="grow" id="hWho"></div></div>
    <p class="hint" style="margin:0 0 8px" id="hHint">What you did, and what happened to your work, newest first.</p>
    <div class="chips" id="hTypes"></div>
    <div class="toolbar">
      <input type="search" id="hSearch" placeholder="Search your history" aria-label="Search your history" autocomplete="off">
      <label class="hf">From <input type="date" id="hFrom"></label>
      <label class="hf">To <input type="date" id="hTo"></label>
      <button type="button" id="hClear">Clear</button>
    </div>
    <div class="msg" id="hMsg" role="status"></div>
    <ul class="hlist" id="hList"></ul>
    <div class="pager" id="pager"></div>
  </main>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui-common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/history.js"></script>
  <script src="js/install.js"></script>
</body>
</html>
