<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My account · MS BMS</title>
  <link rel="icon" href="icons/icon.svg">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/sales.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="page-head"><h1>My account</h1><div class="grow"></div></div>
    <div class="msg" id="aMsg" role="status"></div>
    <div class="dgrid" style="margin-top:0">
      <div class="dpanel"><h3>About me</h3><div id="aboutMe"></div>
        <p class="qhint" style="margin-top:10px">Your position, department, salary and account status are changed by the System Administrator.</p></div>
      <div class="dpanel"><h3>Contact details</h3>
        <form id="contactForm" novalidate>
          <div id="contactBox">
            <label>Phone <input name="phone" id="aPhone" type="tel" maxlength="40" autocomplete="tel" placeholder="+220 …"></label>
            <label>Address <input name="address" id="aAddress" type="text" maxlength="200" autocomplete="street-address"></label>
            <div class="err" id="contactError"></div>
            <div class="msg" id="contactMsg" role="status"></div>
            <button type="submit" class="primary" id="contactSave">Save my details</button>
          </div>
          <p class="empty" id="noEmployee" hidden>No employee profile is linked to this account.</p>
        </form>
      </div>
      <div class="dpanel"><h3>Change password</h3>
        <form id="pwForm" novalidate>
          <input type="text" name="username" id="pwUser" autocomplete="username" hidden>
          <label class="req">Current password <input id="pwCur" type="password" autocomplete="current-password" required></label>
          <label class="req">New password <input id="pwNew" type="password" autocomplete="new-password" minlength="6" required><span class="qhint">At least 6 characters, with a number, a capital letter and a special character (like ! @ # or -).</span></label>
          <label class="req">New password again <input id="pwNew2" type="password" autocomplete="new-password" minlength="6" required></label>
          <div class="err" id="pwError"></div>
          <div class="msg" id="pwMsg" role="status"></div>
          <button type="submit" class="primary" id="pwSave">Change password</button>
        </form>
      </div>
    </div>
  </main>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/account.js"></script>
</body>
</html>
