<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Purchase orders · MS BMS</title>
  <link rel="icon" href="icons/icon.svg">
  <meta name="theme-color" content="#1b3a6b">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/sales.css">
  <link rel="stylesheet" href="css/finance.css">
</head>
<body class="booting app">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
  <header class="appbar"></header>
  <main class="page">
    <div class="page-head">
      <h1>Purchase orders</h1>
      <div class="grow"><a class="btn" href="purchasing/purchase-requests.html?tab=order" id="toOrderLink" hidden>Approved requests to order</a></div>
    </div>
    <div class="tabs" id="tabs">
      <button type="button" class="on" data-tab="open">Open</button>
      <button type="button" data-tab="bill" id="tabBill" hidden>Received, to bill</button>
      <button type="button" data-tab="all">All</button>
    </div>
    <div class="toolbar fin-filters" style="margin-top:0">
      <input id="search" type="search" placeholder="Search number, supplier, item or job">
      <select id="statusFilter"></select>
      <button type="button" id="reloadBtn" class="grow">Refresh</button>
    </div>
    <div class="msg" id="listMsg" role="status"></div>
    <div class="tablewrap">
      <table class="inv">
        <thead><tr><th>Number</th><th>Ordered</th><th>Supplier</th><th>What</th><th>Expected</th><th class="num" id="totHead">Total</th><th>Status</th></tr></thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </main>

  <dialog id="poDialog" class="fin-wide">
    <form class="dlg" id="poForm" novalidate>
      <h3 id="poTitle">New purchase order</h3>
      <div class="info" id="poInfo"></div>
      <div class="two">
        <label class="req">Supplier <select name="supplier_id" id="oSupplier" required></select></label>
        <label>Expected delivery <input name="expected_date" id="oExpected" type="date"></label>
      </div>
      <label>Why this supplier (quotes compared …) <input name="supplier_selection_note" id="oNote" type="text" maxlength="300"></label>
      <div id="oLines"></div>
      <div class="fin-left" id="oTotal"></div>
      <div class="err" id="poError"></div>
      <div class="btns">
        <button type="button" id="poCancel">Cancel</button>
        <button type="submit" class="primary" id="poSave">Issue purchase order</button>
      </div>
    </form>
  </dialog>
  </div>
</div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/finance-common.js"></script>
  <script src="js/stores-common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/purchase-orders.js"></script>
</body>
</html>
